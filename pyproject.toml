[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-company-manager-mcp"
version = "0.2.0"
description = "MCP server that manages a small company's documents, finances, and employees as local files."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "company", "finance", "employees", "stdio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "mcp[cli]>=1.30.0,<2.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
ai-company-manager-mcp = "src.server:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "TID", "RUF"]
ignore = [
    "E501",
    "RUF001",  # Turkish user-facing text legitimately contains dotless i and accented letters
    "RUF002",  # same as RUF001, for identifiers and comments
    "RUF003",  # same as RUF001, for comments
    "PTH105",  # os.replace is used deliberately for atomic writes on all platforms
    "A002",    # `type` is part of the public MCP tool schema and must not be renamed
]

[tool.ruff.lint.per-file-ignores]
"src/server.py" = ["E402"]  # sys.path bootstrap must run before the src imports
"tests/*" = ["S101", "SLF001", "PT011"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
follow_imports = "skip"
